name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, lint, build and staging artifact
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: desert_gallery_test
          MYSQL_USER: dag_test
          MYSQL_PASSWORD: dag_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://dag_test:dag_test_password@127.0.0.1:3306/desert_gallery_test
      MEDIA_STORAGE_ROOT: /tmp/desert-gallery-ci-media
      MYSQL_INTEGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-node22-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -udag_test -pdag_test_password --silent; then exit 0; fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1
      - name: Apply MySQL migrations
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Set up Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v1
      - name: Lighthouse mobile performance budget
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - name: Verify Lighthouse report generation
        run: |
          test -s .lighthouseci/manifest.json
          find .lighthouseci -maxdepth 1 -type f -print
      - name: Upload Lighthouse reports
        if: always() && hashFiles('.lighthouseci/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-${{ github.sha }}
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Package self-hosted staging artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/standalone/.next
          cp -R .next/standalone/. .release/standalone/
          mkdir -p .release/standalone/.next/static
          cp -R .next/static/. .release/standalone/.next/static/
          mkdir -p .release/standalone/public
          if [ -d public ]; then cp -R public/. .release/standalone/public/; fi
          printf 'commit=%s\n' "$GITHUB_SHA" > .release/standalone/BUILD_INFO.txt
          tar -czf desert-art-gallery-staging.tar.gz -C .release/standalone .
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: desert-art-gallery-staging-${{ github.sha }}
          path: desert-art-gallery-staging.tar.gz
          if-no-files-found: error
          retention-days: 7
