name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, lint, build and staging artifact
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: desert_gallery_test
          MYSQL_USER: dag_test
          MYSQL_PASSWORD: dag_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://dag_test:dag_test_password@127.0.0.1:3306/desert_gallery_test
      MEDIA_STORAGE_ROOT: /tmp/desert-gallery-ci-media
      MYSQL_INTEGRATION_TEST: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-node22-
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -udag_test -pdag_test_password --silent; then exit 0; fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1
      - name: Apply MySQL migrations
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Backup, verify and restore local MySQL and media
        shell: bash
        run: |
          set -euo pipefail
          media_fixture="$MEDIA_STORAGE_ROOT/products/ci-fixture/backup-restore-proof.txt"
          mkdir -p "$(dirname "$media_fixture")"
          printf '%s' 'dag-backup-restore-proof' > "$media_fixture"
          backup_output="$(npm run --silent local:backup)"
          printf '%s\n' "$backup_output"
          backup_id="$(printf '%s\n' "$backup_output" | awk '/^Backup ID: / { print $3 }')"
          test -n "$backup_id"
          npm run local:backup:verify -- "$backup_id"

          mysql --protocol=tcp -h127.0.0.1 -uroot -proot -e "CREATE DATABASE desert_gallery_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL PRIVILEGES ON desert_gallery_restore.* TO 'dag_test'@'%';"
          restore_media_root=/tmp/desert-gallery-ci-restore-media
          test ! -e "$restore_media_root"
          DATABASE_URL=mysql://dag_test:dag_test_password@127.0.0.1:3306/desert_gallery_restore MEDIA_STORAGE_ROOT="$restore_media_root" npm run local:restore -- --backup="$backup_id" --confirm-empty-database=desert_gallery_restore --confirm-empty-media-root="$restore_media_root"
          DATABASE_URL=mysql://dag_test:dag_test_password@127.0.0.1:3306/desert_gallery_restore npm run db:status
          test -d "$restore_media_root"
          test "$(cat "$restore_media_root/products/ci-fixture/backup-restore-proof.txt")" = "dag-backup-restore-proof"
          grep -F "Media files: 1" <<< "$backup_output"
      - name: Seed isolated published storefront review fixtures
        env:
          MYSQL_CATALOGUE_ENABLED: "true"
          STOREFRONT_REVIEW_FIXTURES: "true"
        run: npm run storefront:review:seed
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          MYSQL_CATALOGUE_ENABLED: "true"
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture storefront route and viewport evidence
        shell: bash
        env:
          STOREFRONT_REVIEW_BASE_URL: http://localhost:4174
          STOREFRONT_REVIEW_OUTPUT_DIR: .local-data/visual-review/ci-${{ github.sha }}
          MYSQL_CATALOGUE_ENABLED: "true"
          STOREFRONT_REVIEW_FIXTURES: "true"
        run: |
          set -euo pipefail
          server_log=/tmp/desert-art-gallery-visual-review-server.log
          NODE_ENV=production npm run start -- --hostname localhost --port 4174 > "$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..45}; do
            if curl --fail --silent "$STOREFRONT_REVIEW_BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat "$server_log" >&2
            echo "Production server health check did not become ready." >&2
            exit 1
          fi

          npm run visual:review
      - name: Verify deterministic customer interactions
        env:
          STOREFRONT_INTERACTION_BASE_URL: http://localhost:4174
          STOREFRONT_INTERACTION_OUTPUT_DIR: .local-data/interaction-review
          MYSQL_CATALOGUE_ENABLED: "true"
          STOREFRONT_REVIEW_FIXTURES: "true"
        run: npm run smoke:customer
      - name: Upload customer interaction report
        if: always() && hashFiles('.local-data/interaction-review/interaction-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: customer-interaction-review-${{ github.sha }}
          path: .local-data/interaction-review/interaction-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload storefront visual review
        if: always() && hashFiles('.local-data/visual-review/ci-*/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: storefront-route-review-${{ github.sha }}
          path: .local-data/visual-review/ci-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Set up Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v1
      - name: Lighthouse mobile performance budget
        run: npx --yes @lhci/cli@0.14.0 autorun --config=.lighthouserc.json
      - name: Verify Lighthouse report generation
        run: |
          test -s .lighthouseci/manifest.json
          find .lighthouseci -maxdepth 1 -type f -print
      - name: Upload Lighthouse reports
        if: always() && hashFiles('.lighthouseci/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-${{ github.sha }}
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Package self-hosted staging artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/standalone/.next
          cp -R .next/standalone/. .release/standalone/
          mkdir -p .release/standalone/.next/static
          cp -R .next/static/. .release/standalone/.next/static/
          mkdir -p .release/standalone/public
          if [ -d public ]; then cp -R public/. .release/standalone/public/; fi
          printf 'commit=%s\n' "$GITHUB_SHA" > .release/standalone/BUILD_INFO.txt
          tar -czf desert-art-gallery-staging.tar.gz -C .release/standalone .
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: desert-art-gallery-staging-${{ github.sha }}
          path: desert-art-gallery-staging.tar.gz
          if-no-files-found: error
          retention-days: 7
